[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecleaner"
version = "0.1.0"
description = "PipeCleaner: interactive data cleaning and visualization, as a Streamlit app and a CLI."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pipecleaner = "data_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["data_cleaner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
